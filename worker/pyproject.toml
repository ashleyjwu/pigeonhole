[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pigeonhole-worker"
version = "0.1.0"
description = "Ingestion and ML worker for pigeonhole"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pigeonhole_worker"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
